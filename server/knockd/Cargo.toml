[package]
name = "knockd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Knock's signer: World ID RP contexts for bindings, and bind() transactions on World Chain"

[dependencies]
alloy = { version = "2.5.0", features = ["full"] }
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
hex = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa"] }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
