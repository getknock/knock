[package]
name = "knock-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://docs.getknock.dev/guides/verifier"
description = "A site's Knock verifier: /challenge and /verify (V1–V8, knock-verify), reading mainnet ENS and World Chain"
readme = "README.md"
keywords = ["knock", "world-id", "ens", "proof-of-human", "verifier"]
categories = ["authentication", "web-programming::http-server", "command-line-utilities"]

[dependencies]
alloy = { version = "2.5.0", features = ["full"] }
anyhow = "1.0.104"
axum = "0.8.9"
knock-verify = { path = "../../crates/knock-verify", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
